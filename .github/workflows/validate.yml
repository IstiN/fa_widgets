name: validate

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Plain checkout first: `submodules: true` dies with a bare
      # "No url found for submodule path" when a tree carries a gitlink
      # without a .gitmodules entry (publisher rewrote the file instead of
      # appending). Surface that as a readable error BEFORE initializing.
      - uses: actions/checkout@v4
      - name: Preflight — every gitlink must have a .gitmodules entry
        run: |
          status=0
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if ! git config -f .gitmodules --get-regexp '\.path$' 2>/dev/null | grep -q " ${path}\$"; then
              echo "::error file=.gitmodules::gitlink '$path' has no .gitmodules entry — publishers must APPEND sections, never rewrite the file"
              status=1
            fi
          done < <(git ls-files -s | awk '$1 == "160000" {print $4}')
          exit $status
      - name: Init submodules
        run: git submodule update --init --depth 1
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Test
        run: dart test
      - name: Validate widgets
        run: dart run bin/fa_widgets.dart validate --root widgets
