name: validate

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Per-widget git submodules are RETIRED (pins-only catalog): external
      # widgets are materialized by the fetch step below from overlay
      # source pins. Only the runtime submodule is initialized from git.
      - uses: actions/checkout@v4
      - name: Preflight — no per-widget gitlinks (retired scheme)
        run: |
          bad=$(git ls-files -s | awk '$1 == "160000" && $4 != "vendor/js_widget_runtime" {print $4}')
          if [ -n "$bad" ]; then
            echo "::error::per-widget gitlinks are retired — migrate to overlay source pins (repo + full-sha commit): $bad"
            exit 1
          fi
      - name: Init runtime submodule
        run: git submodule update --init --depth 1 vendor/js_widget_runtime
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Test
        run: dart test
      - name: Fetch pinned external sources
        run: dart run bin/fa_widgets.dart fetch --root widgets
      - name: Validate widgets
        run: dart run bin/fa_widgets.dart validate --root widgets
