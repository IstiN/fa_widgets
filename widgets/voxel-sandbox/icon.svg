    <path d="M14 26 L22 30.5 L18 33 L10 28.5 Z" fill="#7DD3FC" opacity="0.9"/>
    <!-- stacked cube behind-right -->
    <path d="M50 26 L54 28.5 L54 44.5 L50 42 Z" fill="#F59E0B" opacity="0.9"/>
    <path d="M42 22 L50 26 L46 28.5 L42 26.5 Z" fill="#FCD34D" opacity="0.9"/>
